[tool.poetry]
name = "buildplanner-api"
version = "0.1.0"
description = "Оркестратор пайплайна GenPlanner -> GenBuilder по id сценария"
authors = ["IDU"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
gunicorn = "^23.0.0"
aiohttp = "^3.10.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sse-starlette = "^2.1.3"
loguru = "^0.7.2"
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
black = "^24.10.0"
isort = "^5.13.0"
pylint = "^3.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-attributes = 12
# Клиенты внешних API — обёртки над многополевыми запросами, аргументы именованные.
max-args = 8
max-positional-arguments = 8
max-locals = 20

[tool.pylint."messages control"]
# Модели и роуты документируются через docstring модуля и `summary=` в декораторе.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "duplicate-code",
]
